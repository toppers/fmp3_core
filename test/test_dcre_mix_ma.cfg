/*
 *		マルチaffinityクラス上の ENA_DYNISR 生成検査用サンプルの
 *		システムコンフィギュレーションファイル
 *
 *  $Id$
 */
INCLUDE("test_common1.cfg");

#include "test_dcre_mix_ma.h"

CLASS(CLS_PRC1) {
	CRE_TSK(TASK1, { TA_ACT, 1, task1, MID_PRIORITY, STACK_SIZE, NULL });
}

/*
 *  ★本サンプルの実体：CFG_INT・CRE_ISR・ENA_DYNISR を、単一プロセッサの
 *  CLS_PRC1 ではなく、複数プロセッサに割り付けられた CLS_ALL_PRC1 の
 *  囲みの中に置く。
 *
 *  ★対象ターゲットは kria_r5（kria_r5-2core、TNUM_PRCID==2）に限定する。
 *  当初 kria_arm64 で試したが、実測で E_RSATR になり不採用にした
 *  （`build/kria_arm64-tmixma` 実測。arch/arm64_gcc/common/gic_kernel.py の
 *  `TargetCheckCfgInt`［NGKI5184：複数プロセッサでの割込み受付は「動作
 *  するはずだが未テスト」の理由で現状サポート外］が、グローバルintnoを
 *  affinityPrcListが2以上のクラスの中に置くことを一般的に禁止するため。
 *  同じ関数が arch/riscv_gcc/common/plic_kernel.py にも存在するため
 *  polarfire_soc_kit も同様に不可。musca_b1/rp2350_pico2 は intno自体が
 *  per-prcid符号化（(prcid<<16)|intno）のため、kernel/interrupt.py:151-164
 *  の汎用検査（class の affinityPrcList 全プロセッサの
 *  INTNO_CREISR_VALID に intno が属することを要求）で同じくE_RSATRになる。
 *
 *  kria_r5（arch/arm_gcc/zynqmp_r5）だけがこの検査を持たない：
 *  target_kernel.py が `IncludeTrb("chip_kernel.py")` するのみで、
 *  arm64_gcc 側のように `chip_kernel.py` から `gic_kernel.py` を
 *  IncludeTrb していない（`arch/arm_gcc/common/gic_kernel.trb` は
 *  pristine のまま .py に変換されておらず、target_kernel.py からも
 *  参照されていない）。これは今回の dcre 移植が入れた差ではなく、
 *  upstream の R5 ポート自体が最初からこの安全網を持っていない
 *  （`arch/arm_gcc/zynqmp_r5/chip_kernel.trb` にも同種の記述が無い）
 *  ことを実機のソース突き合わせで確認済み。すなわちこれは
 *  「dcreのISR拡張が生んだ新しい抜け」ではなく「upstreamに元々あった
 *  非対称」であり、本サンプルはそれを踏み台にして生成レベルの実証を
 *  可能にしているに過ぎない（DIVERGENCE_MAP.md 参照）。
 *
 *  INTNO1（kria_r5 の target_test.h で 40 と定義）は
 *  arch/arm_gcc/zynqmp_r5/chip_kernel.py の global_intno_list（32..186）に
 *  属し、プロセッサ間で同一の値を持つ（per-prcid符号化ではない）。
 *
 *  この構成で、生成される DEF_INH 相当のエントリが affinityPrcList の
 *  要素数（kria_r5-2core なら2個）ぶん作られ、いずれも同一の
 *  `_kernel_inthdr_40` と同一の isr_queue_table 添字を指すことを、
 *  生成物 grep で実証する（docs/dynamic-creation.md §7.6 訂正H の
 *  申し送りに対する回答。実測：`_kernel_inh_table_prc1[0x28]` と
 *  `_kernel_inh_table_prc2[0x28]` の両方が `_kernel_inthdr_40` を指し、
 *  `_kernel_inthdr_40` は `_kernel_isr_queue_table[0]` 1個だけを呼ぶ）。
 */
CLASS(CLS_ALL_PRC1) {
	CFG_INT(INTNO1, { INTNO1_INTATR, INTNO1_INTPRI });
	CRE_ISR(MA_ISR1, { TA_NULL, 1, INTNO1, ma_isr1, 1 });
	ENA_DYNISR(INTNO1);
}

/*
 *  訂正E ガード（AID_ISR(n>0) には静的 CRE_ISR が1個以上必要）は
 *  MA_ISR1 自身で満たす．
 */
AID_ISR(1);
