#
#  M5Stamp ESP32P4（ESP32-P4 HP RISC-V 2コア）ソースデバッグ用 GDB 初期化スクリプト
#
#  本ファイルは**接続済み**の GDB に対する初期設定を行う．OpenOCD への接続
#  （target extended-remote）は呼び出し側が -ex で先に指定すること．
#  通常は Makefile の `make jtaggdb` が両方を組み立てて渡す．
#
#  手で使う場合（OpenOCD を GDB の子プロセスとしてパイプ起動する例）:
#
#      riscv32-esp-elf-gdb \
#        -ex 'target extended-remote | openocd -c "gdb_port pipe; log_output openocd.log" \
#             -c "adapter serial 30:ed:a0:ea:98:0e" -f board/esp32p4-builtin.cfg' \
#        -x <target>/gdb.ini <fmp_loader.elf>
#
#  別端末で OpenOCD を常駐させている場合は代わりに:
#      -ex 'target extended-remote :3333'
#
#  ★対象ボードは `adapter serial <USB シリアル番号 = MAC>` で固定すること．
#    複数ボードを繋いだ環境で未指定だと OpenOCD が最初に見つけたボードを掴み，
#    意図しないボードをデバッグしてしまう．
#  ★PATH 上の openocd は ESP-IDF 同梱の openocd-esp32 であること．
#    upstream OpenOCD は board/esp32p4-builtin.cfg を持たず ESP32-P4 に非対応．
#    （. $IDF_PATH/export.sh を先に実行すれば同梱版が PATH 先頭に来る）
#
#  接続時に "warning: Overlapping regions in memory map: ignoring" が出るが，
#  ESP32-P4 は .iram0.text(RAM 実行)と .flash.text(XIP)が混在し OpenOCD の
#  メモリマップと重なるためで，動作に影響しない．
#

set confirm off
set pagination off

#
#  ★★リセットを跨いでブレークポイントを張らないこと（実測に基づく方針）★★
#
#  ESP32-P4 では `monitor reset halt` の後，ブート途中でハートがリセットされ
#  （OpenOCD が "Hart unexpectedly reset!" を出す），RISC-V デバッグトリガ
#  （＝ハードウェアブレークポイント）が消える．GDB が再挿入するより先に実行が
#  当該番地を通過するとブレークせず，そのまま走り去る．
#  実測（同一条件の反復）:
#      reset halt + toppers_start でブレーク  … 3/5 でしか停止しない（レース）
#      リセットせず attach してブレーク        … 5/5 で安定
#  なお `reset halt` → `resume` ではバナーも mtrans2 完走も出るので，
#  **ブートが壊れているのではなく，ブレークポイントが消えるのが原因**である．
#
#  したがって本ファイルの既定は「走行中のターゲットに attach して halt する」．
#  リセットは行わない．
#
monitor halt

#  この時点で両コアは停止している（2 コアは halt group にまとめられており，
#  片方を halt すると両方 halt する）．以降は通常どおりブレークポイントを
#  張って continue すればよい．例:
#      (gdb) break _kernel_dispatch
#      (gdb) continue
#      (gdb) info threads      … 2 コアを確認．thread <n> で切替
#
#  ★ハードウェアブレークポイントは 1 コアあたり 3 個のみ（OpenOCD の
#    "Found 3 triggers"）．FMP3 の text は .iram0.text＝RAM 実行なので
#    通常の break（ソフトウェア BP）が使える．hbreak/thb は flash XIP 上の
#    コード（IDF ローダ殻）に限って使い，3 個を使い切らないこと．
#
#  【FMP3 の起動そのものをデバッグしたい場合】
#    方式(a)の起動連鎖は実測で次のとおり:
#      #0 toppers_start ()    at arch/riscv_gcc/common/start.S:66  ← FMP3 入口(.iram0.text)
#      #1 app_main ()         at tools/fmp_loader/main/fmp_loader.c
#      #2 main_task ()        at esp-idf/components/freertos/app_startup.c
#      #3 vPortTaskWrapper () at esp-idf/.../portable/riscv/port.c
#    ここで止めるには下記を手で実行する．ただし上記のレースにより**毎回は
#    停止しない**（実測 3/5）．停止しなければ繰り返すこと．
#      (gdb) monitor reset halt
#      (gdb) maintenance flush register-cache
#      (gdb) thb toppers_start
#      (gdb) continue
#    確実に止めたい場合は，アプリ側に待ちループを置いて
#    デバッガから変数を書き換えて抜ける方法が確実である．

echo \n[gdb.ini] 走行中のターゲットに attach し halt しました（リセットしていません）．\n
echo [gdb.ini] break <関数> → continue でデバッグ．info threads で 2 コア確認．\n
echo [gdb.ini] 起動そのものを追う場合は gdb.ini 内の注記を参照（レースあり）．\n\n
