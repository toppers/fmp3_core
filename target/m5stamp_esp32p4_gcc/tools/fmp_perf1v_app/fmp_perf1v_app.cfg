/*
 *  ESP32-P4 FMP3 / perf1 ベクタ使用改造版 コンフィグ
 *
 *  全タスク PRC1．計測法は perf1 と同一(histogram)．eager/lazy 両構成でビルドして比較する．
 *  lazy(PIE_LAZY=1)では切換え後の初回ベクタが非オーナトラップになるため DEF_EXC が要る．
 *  histogram.o のリンクが要る(EXTRA_SOBJS="histogram.o")．
 */
INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

#include "fmp_perf1v_app.h"

#ifdef TOPPERS_PIE_LAZY
CLASS(CLS_PRC1) {
	DEF_EXC(0x10000U | EXCNO_IINST, { TA_NULL, pie_exc_handler });
}
CLASS(CLS_PRC2) {
	DEF_EXC(0x20000U | EXCNO_IINST, { TA_NULL, pie_exc_handler });
}
#endif /* TOPPERS_PIE_LAZY */

CLASS(CLS_PRC1) {
	CRE_TSK(TASK1,     { TA_NULL, 1, task1,     TASK1_PRIORITY, STACK_SIZE, NULL });
	CRE_TSK(TASK2,     { TA_NULL, 2, task2,     TASK2_PRIORITY, STACK_SIZE, NULL });
	CRE_TSK(MAIN_TASK, { TA_ACT,  0, main_task, MAIN_PRIORITY,  STACK_SIZE, NULL });
}
