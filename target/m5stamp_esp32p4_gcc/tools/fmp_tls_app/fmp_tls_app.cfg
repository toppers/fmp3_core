/*
 *  ESP32-P4 FMP3 移植 / TLS 初期化検証アプリ コンフィグ (SMP対応)
 *
 *  syssvc(syslog/banner/serial/logtask) を初期化し，各 PE に検証タスクを
 *  自動起動する。PRC_NUM=1 なら PRC1 のみ，PRC_NUM>=2 なら PRC2 にも配置。
 */
INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

#include "fmp_tls_app.h"

CLASS(CLS_ALL_PRC1){
	CRE_TSK(TLS_TASK1, { TA_ACT, 1, tls_task, TLS_PRIORITY, STACK_SIZE, NULL });
}

#if TNUM_PRCID >= 2
CLASS(CLS_ALL_PRC2){
	CRE_TSK(TLS_TASK2, { TA_ACT, 2, tls_task, TLS_PRIORITY, STACK_SIZE, NULL });
}
#endif /* TNUM_PRCID >= 2 */
