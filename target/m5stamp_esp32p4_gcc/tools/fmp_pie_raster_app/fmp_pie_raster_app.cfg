/*
 *  ESP32-P4 FMP3 移植 / lazy PIE: ras_ter 要求終了の release_context 実証アプリ コンフィグ
 *
 *  全タスク PRC1．TERM(prio9, dis_ter)が PIE オーナになり REQUESTER(prio8)を wup→ras_ter(TERM)で
 *  raster セット→TERM が ena_ter でオーナのまま自タスク終了→後続 WORKER(prio9)が start_r 起動．
 *  WORKER は PIE 累算の途中で dly_tsk し NOISE(prio10)にオーナを奪わせ golden 照合する．
 *  REPORT(prio8)が golden 計測・チェーン kick・周期集計を行う．PRC_NUM=2 でビルド(動作は PRC1)．
 */
INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

#include "fmp_pie_raster_app.h"

#ifdef TOPPERS_PIE_LAZY
/*  lazy: 非オーナの初回 PIE 命令を illegal トラップ→pie_exc_handler(各 PE 登録)  */
CLASS(CLS_PRC1) {
	DEF_EXC(0x10000U | EXCNO_IINST, { TA_NULL, pie_exc_handler });
}
CLASS(CLS_PRC2) {
	DEF_EXC(0x20000U | EXCNO_IINST, { TA_NULL, pie_exc_handler });
}
#endif /* TOPPERS_PIE_LAZY */

CLASS(CLS_PRC1) {
	CRE_TSK(REPORT_TASK,    { TA_ACT,  0, report_task,    REPORT_PRIORITY,    STACK_SIZE, NULL });
	CRE_TSK(REQUESTER_TASK, { TA_ACT,  0, requester_task, REQUESTER_PRIORITY, STACK_SIZE, NULL });
	CRE_TSK(TERM_TASK,      { TA_NULL, 0, term_task,      TERM_PRIORITY,      STACK_SIZE, NULL });
	CRE_TSK(WORKER_TASK,    { TA_NULL, 0, worker_task,    WORKER_PRIORITY,    STACK_SIZE, NULL });
	CRE_TSK(NOISE_TASK,     { TA_ACT,  0, noise_task,     NOISE_PRIORITY,     STACK_SIZE, NULL });
}
