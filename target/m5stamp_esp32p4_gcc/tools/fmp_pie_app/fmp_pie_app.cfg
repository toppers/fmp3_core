/*
 *  ESP32-P4 FMP3 移植 / PIE save/restore 実証アプリ コンフィグ
 *
 *  syssvc を初期化し，同一コア(PRC1)に LOW/HIGH/REPORT を自動起動する．
 *  3 タスクとも PRC1 に固定し，HIGH が LOW を PIE 演算中にプリエンプトする状況を作る．
 */
INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

#include "fmp_pie_app.h"

#ifdef TOPPERS_PIE_LAZY
/*
 *  lazy PIE では非オーナの初回 PIE 命令を illegal トラップさせて pie_exc_handler で
 *  オンデマンド退避/復元する．EXCNO_IINST(=2)を PE エンコード(PRC1=0x10000, PRC2=0x20000)で
 *  各 PE 登録する(DEF_EXC は対応する PE のクラス内に置く規約)．本アプリは全 PRC1 固定だが，
 *  移行検証(PRC2 使用)にも備え両 PE 登録(PRC_NUM=2 前提)．
 */
CLASS(CLS_PRC1) {
	DEF_EXC(0x10000U | EXCNO_IINST, { TA_NULL, pie_exc_handler });
}
CLASS(CLS_PRC2) {
	DEF_EXC(0x20000U | EXCNO_IINST, { TA_NULL, pie_exc_handler });
}
#endif /* TOPPERS_PIE_LAZY */

CLASS(CLS_ALL_PRC1){
	CRE_TSK(LOW_TASK,    { TA_ACT, 1, low_task,    LOW_PRIORITY,    STACK_SIZE, NULL });
	CRE_TSK(HIGH_TASK,   { TA_ACT, 2, high_task,   HIGH_PRIORITY,   STACK_SIZE, NULL });
	CRE_TSK(REPORT_TASK, { TA_ACT, 3, report_task, REPORT_PRIORITY, STACK_SIZE, NULL });
}
