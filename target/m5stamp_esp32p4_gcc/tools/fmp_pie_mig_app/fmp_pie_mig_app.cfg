/*
 *  ESP32-P4 FMP3 移植 / lazy PIE マイグレーション正当性 実証アプリ コンフィグ
 *
 *  WORKER(CLS_ALL_PRC1, 初期PRC1, 全PE割付可)が pie_compute_mig で PE1↔PE2 を
 *  バウンスしながら PIE 累算し golden 照合．各 PE の NOISE が連続 PIE してオーナを
 *  奪い合い，WORKER 到着時の「非オーナ→トラップ復元」を誘発する．PRC_NUM=2 前提．
 */
INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

#include "fmp_pie_mig_app.h"

#ifdef TOPPERS_PIE_LAZY
/*  lazy: 非オーナの初回 PIE 命令を illegal トラップ→pie_exc_handler(各 PE 登録)  */
CLASS(CLS_PRC1) {
	DEF_EXC(0x10000U | EXCNO_IINST, { TA_NULL, pie_exc_handler });
}
CLASS(CLS_PRC2) {
	DEF_EXC(0x20000U | EXCNO_IINST, { TA_NULL, pie_exc_handler });
}
#endif /* TOPPERS_PIE_LAZY */

CLASS(CLS_PRC1) {
	CRE_TSK(REPORT_TASK, { TA_ACT, 0, report_task, REPORT_PRIORITY, STACK_SIZE, NULL });
	CRE_TSK(NOISE_A,     { TA_ACT, NOISE_A_SEED, noise_task, NOISE_PRIORITY, STACK_SIZE, NULL });
}
CLASS(CLS_PRC2) {
	CRE_TSK(NOISE_B,     { TA_ACT, NOISE_B_SEED, noise_task, NOISE_PRIORITY, STACK_SIZE, NULL });
}
CLASS(CLS_ALL_PRC1) {
	CRE_TSK(WORKER_TASK, { TA_ACT, 0, worker_task, WORKER_PRIORITY, STACK_SIZE, NULL });
}
