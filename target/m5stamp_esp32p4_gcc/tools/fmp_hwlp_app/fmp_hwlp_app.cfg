/*
 *  ESP32-P4 FMP3 移植 / HWLP save/restore 実証アプリ コンフィグ
 *
 *  syssvc(syslog/banner/serial/logtask) を初期化し, 同一コア(PRC1)に
 *  LOW/HIGH/REPORT の 3 タスクを自動起動する. 3 タスクとも PRC1 に固定して
 *  単一コア上で時分割させ, HIGH が LOW を hwloop 実行中にプリエンプトする状況を作る.
 */
INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

#include "fmp_hwlp_app.h"

CLASS(CLS_ALL_PRC1){
	CRE_TSK(LOW_TASK,    { TA_ACT, 1, low_task,    LOW_PRIORITY,    STACK_SIZE, NULL });
	CRE_TSK(HIGH_TASK,   { TA_ACT, 2, high_task,   HIGH_PRIORITY,   STACK_SIZE, NULL });
	CRE_TSK(REPORT_TASK, { TA_ACT, 3, report_task, REPORT_PRIORITY, STACK_SIZE, NULL });
}
