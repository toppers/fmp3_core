/*
 *  ESP32-P4 FMP3 / lazy PIE 非オーナ初回ベクタ命令の例外処理時間 計測アプリ コンフィグ
 *
 *  MEAS(prio10) と STEAL(prio9) を PRC1 に置く．lazy(PIE_LAZY=1)でのみ意味を持つ
 *  (DEF_EXC(EXCNO_IINST, pie_exc_handler) で非オーナ初回 PIE 命令をトラップさせる)．
 */
INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
INCLUDE("syssvc/serial.cfg");
INCLUDE("syssvc/logtask.cfg");

#include "fmp_pie_perf_app.h"

#ifdef TOPPERS_PIE_LAZY
CLASS(CLS_PRC1) {
	DEF_EXC(0x10000U | EXCNO_IINST, { TA_NULL, pie_exc_handler });
}
CLASS(CLS_PRC2) {
	DEF_EXC(0x20000U | EXCNO_IINST, { TA_NULL, pie_exc_handler });
}
#endif /* TOPPERS_PIE_LAZY */

CLASS(CLS_PRC1) {
	CRE_TSK(STEAL_TASK, { TA_ACT, 0, steal_task, STEAL_PRIORITY, STACK_SIZE, NULL });
	CRE_TSK(MEAS_TASK,  { TA_ACT, 0, meas_task,  MEAS_PRIORITY,  STACK_SIZE, NULL });
}
