/*
 *  静的な CRE_SEM が1個も無いのに AID_SEM を書くと E_OBJ（訂正E ガード）
 *
 *  ★調整: 素朴に INCLUDE("test/test_common1.cfg") すると、TOPPERS_OMIT_TECS
 *  ビルドでは syssvc/serial.cfg が CLS_SERIAL 内に CRE_SEM(SERIAL_RCV_SEM1)/
 *  CRE_SEM(SERIAL_SND_SEM1) を必ず生成するため「静的 CRE_SEM が0個」という
 *  前提が崩れ、E_OBJ が発火しない（実測で確認：ruby/python とも rc=0 で
 *  素通りした）。cyc/alm と異なり sem だけがこの罠を持つ（flg/mtx は
 *  syssvc/*.cfg に静的定義が無いため test_common1.cfg のままで良い）。
 *  そのため test_common1.cfg の代わりに syslog.cfg/banner.cfg のみを
 *  個別に INCLUDE し、serial.cfg（＝静的 CRE_SEM の発生源）を避ける。
 *
 *  実行時に EXTRA_CFLAGS として「-I<repo>/test」（第4引数）を渡すこと。
 */
INCLUDE("syssvc/syslog.cfg");
INCLUDE("syssvc/banner.cfg");
#include "test_int2.h"
CLASS(CLS_PRC1) {
	CRE_TSK(TASK1, { TA_ACT, 1, task1, MID_PRIORITY, STACK_SIZE, NULL });
}
AID_SEM(2);
