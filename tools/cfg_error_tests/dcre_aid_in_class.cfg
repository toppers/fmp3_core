/*
 *  AID_TSK をクラスの囲みの中に書くと E_RSATR（クラス外専用 API）
 *
 *  ★INCLUDE()の探索はcwd相対（cfg_py/cfg.py:search_file_path）で、run.shは
 *  常にスクラッチディレクトリへcdしてから両エンジンを起動するため、
 *  「test_common1.cfg」単体では解決できない。「-I .」（リポジトリルート）
 *  経由で解決させるため「test/test_common1.cfg」と書く（実行には
 *  EXTRA_CFLAGS="-I<repo>/test"を第4引数に渡し、#include "test_int2.h"
 *  側の解決もあわせて行う）。
 */
INCLUDE("test/test_common1.cfg");
#include "test_int2.h"
CLASS(CLS_PRC1) {
	CRE_TSK(TASK1, { TA_ACT, 1, task1, MID_PRIORITY, STACK_SIZE, NULL });
	AID_TSK(1);
}
